<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KaruChu Homepage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/x-icon" href="https://cdn.laciediao-pdp.io.vn/nh%C3%A1p.png">
<meta name="description" content="CVA 日本語クラブ - KaruChu">
<meta name="theme-color" content="#00a3e8">
<meta property="og:type" content="website">
<meta property="og:url" content="https://karuchu.laciediao-pdp.io.vn/">
<meta property="og:title" content="KaruChu Homepage">
<meta property="og:description" content="CVA 日本語クラブ - KaruChu">
<meta property="og:image" content="https://i.ibb.co/LXjYDPGP/rb-m26.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1422">
<meta property="og:image:height" content="800">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Roboto:wght@400;500;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1&display=swap" rel="stylesheet">
<!-- TWEAK: thêm weight thật cho Shippori Mincho (trước đây chỉ có 400 nên 900 bị giả in đậm) -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><p class="err">Trang cần bật JavaScript để hiển thị nội dung.</p></noscript>
<button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
<nav class="menu" id="menu" aria-label="Main"></nav>

<header class="hero" id="top">
  <img class="hero-bg" src="https://cdn.laciediao-pdp.io.vn/cover.png" alt="" fetchpriority="high" onerror="this.remove()">
  <h1 id="heroTitle" lang="ja"></h1>
  <p class="hero-sub" id="heroSub"></p>
  <div class="badge" id="heroBadge" lang="ja"></div>
  <a class="chip" id="heroCta" href="#join"></a>
</header>

<section class="message" id="about">
  <div class="message-text" lang="ja"><div id="messageLines"></div></div>
  <div class="message-conveyor"><div class="conveyor-track" id="conveyorTrack"></div></div>
</section>
<section class="block" id="team"><h2 id="teamHead"></h2><div id="teamGroups"></div></section>
<section class="block alt" id="events"><h2 id="evHead"></h2><div class="tiles" id="evTiles"></div></section>
<section class="block" id="video"><h2 id="vidHead"></h2><div id="vidBox"></div></section>
<section class="block alt" id="join"><h2 id="joinHead"></h2><p class="soon" id="joinStatus"></p><div id="joinBanner"></div></section>

<section class="social"><h3 id="socHead"></h3><div class="icons" id="socIcons"></div></section>
<footer><strong id="brand"></strong><nav id="footLinks"></nav><small id="copy"></small></footer>
<a class="pagetop" href="#top">PAGE TOP</a>

<script>
const $ = s => document.querySelector(s);
fetch('content.json').then(r => r.json()).then(d => {
  document.title = d.site.title;
  $('#menu').innerHTML = d.nav.map(n => `<a href="${n.href}">${n.label}<small lang="ja">${n.sub}</small></a>`).join('');
  $('#heroTitle').innerHTML = d.hero.title.map(l => `<span>${l}</span>`).join('');
  $('#heroSub').textContent = d.hero.sub;
  $('#heroBadge').textContent = d.hero.badge;
  $('#heroCta').textContent = d.hero.cta.label; $('#heroCta').href = d.hero.cta.href;
  // Conveyor in #about: list is doubled for a seamless loop. Add/remove URLs in "conveyor.photos" (content.json).
  const photos = (d.conveyor && d.conveyor.photos) || [];
  const track = $('#conveyorTrack');
  if (photos.length) {
    const imgs = photos.map(src => `<img src="${src}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`).join('');
    track.innerHTML = imgs + imgs;
    track.style.animationDuration = (photos.length * 4) + 's';
  }
  $('#messageLines').innerHTML = d.message.map(l => `<p>${l}</p>`).join('');

  $('#teamHead').textContent = d.team.heading;
  // TWEAK: bỏ <br> trong rank (CSS text-wrap:balance lo việc xuống dòng) để các thẻ canh đều nhau
  const clean = s => String(s).replace(/<br\s*\/?>/gi, ' ').replace(/\s+/g, ' ').trim();
  $('#teamGroups').innerHTML = d.team.groups.map(g => `
    <div class="group" style="--c1:${g.c1};--c2:${g.c2}">
      <h3 class="group-title">${g.label}<small lang="ja">${g.jp}</small></h3>
      <div class="team-row">${g.members.map(p => `
        <article class="card">
          <div class="thumb"><b>${p.name.trim()[0]}</b>${p.photo ? `<img src="${p.photo}" alt="${p.name}" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</div>
          <h3>${p.name}</h3><span class="jp">${clean(p.rank)}</span>
        </article>`).join('')}
      </div>
    </div>`).join('');

  $('#evHead').textContent = d.events.heading;
  // TWEAK: alt = tên sự kiện (trước là chữ kanji), lazy-load ảnh, chỉ hiện mô tả khi có nội dung thật
  $('#evTiles').innerHTML = d.events.items.map(i => {
    const desc = (i.text && i.text.trim() && i.text.trim() !== 'desc') ? `<span>${i.text}</span>` : '';
    return `
    <a class="tile" href="https://youtu.be/dQw4w9WgXcQ" style="--c1:${i.c1};--c2:${i.c2}">
      <div class="art">${i.photo ? `<img src="${i.photo}" alt="${i.title}" loading="lazy" decoding="async">` : `<b lang="ja">${i.jp}</b>`}</div>
      <div class="cap"><strong>${i.title}</strong>${desc}</div>
      <em class="more">${d.events.button}</em>
    </a>`;
  }).join('');

  const v = d.video;
  $('#vidHead').textContent = v.heading;
  $('#vidBox').innerHTML = `<a class="film" href="${v.url}" aria-label="Xem video: ${v.title}"><span class="play"></span><strong lang="ja">${v.title}</strong></a>
    <p class="cap-c" lang="ja">${v.caption}</p><a class="btn" href="${v.url}">${v.button}</a>`;

  const j = d.join;
  $('#joinHead').textContent = j.heading;
  $('#joinStatus').textContent = j.status;
  $('#joinBanner').innerHTML = `<div class="banner"><strong lang="ja">${j.banner.jp}</strong><span>${j.banner.text}</span><a class="btn" href="${j.banner.href}">${j.banner.button}</a></div>`;

  $('#socHead').textContent = d.social.heading;
  $('#socIcons').innerHTML = d.social.links.map(l => `<a href="${l.href}" aria-label="${l.label}">${l.label}</a>`).join('');
  $('#brand').textContent = d.site.brand;
  $('#footLinks').innerHTML = d.footer.links.map(l => `<a href="${l.href}">${l.label}</a>`).join('');
  $('#copy').textContent = d.footer.copy;
}).catch(() => {
  document.body.insertAdjacentHTML('afterbegin', '<p class="err">Could not load content.json. Open this page through a local server (e.g. VS Code Live Server) instead of double-clicking the file.</p>');
});

const btn = $('#menuBtn'), menu = $('#menu');
const toggle = open => { menu.classList.toggle('open', open); btn.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); };
btn.onclick = () => toggle(!menu.classList.contains('open'));
menu.onclick = e => { if (e.target.closest('a')) toggle(false); };
// TWEAK: nhấn Esc để đóng menu
document.addEventListener('keydown', e => { if (e.key === 'Escape' && menu.classList.contains('open')) { toggle(false); btn.focus(); } });
</script>
</body>
</html>
